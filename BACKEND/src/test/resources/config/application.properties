# Giá trị chỉ dùng khi chạy test, không dùng cho môi trường thật.
# Nằm ở classpath:/config/ nên được ưu tiên hơn application.properties chính, không cần file .env khi chạy test.
jwt.secret=test-only-jwt-secret-key-for-unit-tests-0123456789
app.seed.default-password=test-seed-password
spring.datasource.password=
# Test chạy vào giờ bất kỳ nên không chặn mở ca ngoài khung giờ (có test riêng bật lại)
pos.shift.enforce-open-window=false
# Tắt giới hạn số request để các test tích hợp gọi API liên tục không bị 429 (có test riêng cho bộ lọc)
api.rate-limit.per-minute=0

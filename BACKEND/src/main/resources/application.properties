# ===================================================================
# POS & INVENTORY SYSTEM - SPRING BOOT CONFIGURATION
# ===================================================================

spring.application.name=pos-backend

# Đọc biến môi trường từ file .env ở thư mục gốc repo (chạy từ BACKEND/ hoặc từ gốc).
# Biến môi trường của hệ điều hành vẫn được ưu tiên hơn giá trị trong .env.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# --- Database Configuration (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pos_inventory}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --- JWT Security Configuration ---
# Bắt buộc: chuỗi bí mật tối thiểu 32 ký tự, đặt trong .env (không có giá trị mặc định)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Tài khoản mẫu (admin, cashier) tạo khi DB trống ---
app.seed.default-password=${SEED_DEFAULT_PASSWORD:}

# --- CORS Configuration ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*,file://*}

# --- AI & Forecasting Configuration (AI_for_POS.md) ---
ai.forecast.default-days=${AI_DEFAULT_FORECAST_DAYS:7}
ai.forecast.algorithm=${AI_FORECAST_ALGORITHM:EXP_SMOOTH}
ai.forecast.alpha=${AI_FORECAST_ALPHA:0.35}
ai.forecast.ma-window=${AI_FORECAST_MA_WINDOW:7}
ai.forecast.service-level-z=${AI_SERVICE_LEVEL_Z:1.65}
ai.forecast.lead-time-days=${AI_LEAD_TIME_DAYS:2}
ai.forecast.history-days=${AI_HISTORY_DAYS:30}
ai.forecast.validation-days=${AI_VALIDATION_DAYS:7}

# --- Điện thoại quét mã phải cùng mạng (LAN) với máy POS ---
# Tắt (false) chỉ khi thử nghiệm: điện thoại ở bất kỳ đâu cũng bắn mã được vào quầy
scanner.same-network.enabled=${SCANNER_REQUIRE_SAME_NETWORK:true}
# Hai IPv4 nội bộ cùng dải /24 (vd. 192.168.1.x) được coi là cùng mạng; mạng lớn hơn thì giảm (vd. 16)
scanner.same-network.ipv4-prefix=${SCANNER_LAN_IPV4_PREFIX:24}
scanner.same-network.ipv6-prefix=${SCANNER_LAN_IPV6_PREFIX:64}
# Chỉ bật khi backend đứng sau reverse proxy tin cậy (nginx...) có ghi X-Forwarded-For
scanner.same-network.trust-forwarded-for=${SCANNER_TRUST_FORWARDED_FOR:false}

# --- Ca làm việc ---
pos.shift.require-open-shift=${POS_REQUIRE_OPEN_SHIFT:true}

# --- Swagger / OpenAPI UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Encoding ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# POS & INVENTORY SYSTEM - SPRING BOOT CONFIGURATION
# ===================================================================

spring.application.name=pos-backend
server.port=${SERVER_PORT:8080}

# --- Database Configuration (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pos_inventory}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT Security Configuration ---
# 256-bit Base64-encoded secret key
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS Configuration ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,file://*}

# --- AI & Forecasting Configuration (AI_for_POS.md) ---
ai.forecast.default-days=${AI_DEFAULT_FORECAST_DAYS:7}
ai.forecast.algorithm=${AI_FORECAST_ALGORITHM:EXP_SMOOTH}
ai.forecast.safety-factor=${AI_SAFETY_STOCK_FACTOR:1.10}
ai.forecast.lead-time-days=${AI_LEAD_TIME_DAYS:3}

# --- Swagger / OpenAPI UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Encoding ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

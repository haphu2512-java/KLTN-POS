name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile (expo bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOBILE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MOBILE/package-lock.json
      - run: npm ci
      - run: npx expo export --platform android --output-dir dist

  ai-forecast:
    name: AI Forecast (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_FORECAST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI_FORECAST/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

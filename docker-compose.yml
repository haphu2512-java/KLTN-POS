version: '3.8'

# Mọi giá trị lấy từ file .env ở thư mục gốc (cp .env.example .env). Các biến bí mật là bắt buộc.

services:
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-pos_inventory}
      MYSQL_USER: ${DB_USER:-posuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-network

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-pos_inventory}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-posuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*,file://*}
      AI_FORECAST_ALGORITHM: ${AI_FORECAST_ALGORITHM:-EXP_SMOOTH}
      AI_DEFAULT_FORECAST_DAYS: ${AI_DEFAULT_FORECAST_DAYS:-7}
      AI_LEAD_TIME_DAYS: ${AI_LEAD_TIME_DAYS:-2}
      AI_SERVICE_LEVEL_Z: ${AI_SERVICE_LEVEL_Z:-1.65}
      AI_HISTORY_DAYS: ${AI_HISTORY_DAYS:-30}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - pos-network

volumes:
  mysql_data:
    driver: local

networks:
  pos-network:
    driver: bridge

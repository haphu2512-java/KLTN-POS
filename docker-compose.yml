version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-pos_inventory}
      MYSQL_USER: ${DB_USER:-posuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospass123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-network

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-pos_inventory}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-posuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-pospass123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,file://*}
      AI_FORECAST_ALGORITHM: ${AI_FORECAST_ALGORITHM:-EXP_SMOOTH}
      AI_DEFAULT_FORECAST_DAYS: ${AI_DEFAULT_FORECAST_DAYS:-7}
      AI_SAFETY_STOCK_FACTOR: ${AI_SAFETY_STOCK_FACTOR:-1.10}
      AI_LEAD_TIME_DAYS: ${AI_LEAD_TIME_DAYS:-3}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - pos-network

volumes:
  mysql_data:
    driver: local

networks:
  pos-network:
    driver: bridge
